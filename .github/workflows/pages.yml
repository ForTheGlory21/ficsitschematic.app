# Publishes the web/ folder to GitHub Pages with GitHub Actions. Run by hand (Actions -> Publish website ->
# Run workflow) with Settings -> Pages -> Source: "GitHub Actions".
# The site is normally published from the gh-pages branch instead (see README: Publishing), which needs no Actions.
name: Publish website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
